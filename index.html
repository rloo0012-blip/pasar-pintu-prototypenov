<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Pasar Pintu – WhatsApp commerce prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--hdr:#008069;--bg:#fff;--bg2:#f0f2f5;--chat:#efeae2;--in:#fff;--out:#d9fdd3;--tx:#111b21;--tx2:#667781;--ln:#e9edef;--acc:#00a884;--page:#cfe3d9;--bar:#fff;--veg:rgba(0,168,132,.14);--fruit:rgba(245,166,35,.2);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hdr:#1f2c34;--bg:#111b21;--bg2:#202c33;--chat:#0b141a;--in:#202c33;--out:#005c4b;--tx:#e9edef;--tx2:#8696a0;--ln:#222d34;--acc:#00a884;--page:#0b1a15;--bar:#1f2c34;color-scheme:dark}}
:root[data-theme="dark"]{--hdr:#1f2c34;--bg:#111b21;--bg2:#202c33;--chat:#0b141a;--in:#202c33;--out:#005c4b;--tx:#e9edef;--tx2:#8696a0;--ln:#222d34;--acc:#00a884;--page:#0b1a15;--bar:#1f2c34;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--page);font-family:"Segoe UI",Helvetica,Arial,sans-serif;color:var(--tx);font-size:14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.stage{height:100%;display:flex;align-items:center;justify-content:center;padding:8px;box-sizing:border-box}
.phone{width:100%;max-width:390px;height:100%;max-height:840px;background:var(--bg);border-radius:30px;border:6px solid #0d1418;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.top{background:var(--hdr);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;min-height:28px}
.top h1{font-size:19px;font-weight:600;margin:0;flex:1}
.top .ic{font-size:17px;opacity:.9}
.back{font-size:20px;color:#fff}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:14px;flex:none}
.scroll{flex:1;overflow-y:auto;background:var(--bg)}
.tabs{display:flex;background:var(--bar);border-top:1px solid var(--ln)}
.tabs button{flex:1;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--tx2)}
.tabs button span{font-size:19px;line-height:1}
.tabs .on{color:var(--acc);font-weight:600}
.row{display:flex;gap:12px;padding:11px 14px;align-items:center;border-bottom:1px solid var(--ln);width:100%;text-align:left;box-sizing:border-box}
.row .m{flex:1;min-width:0}
.row b{display:block;font-weight:600;font-size:15px}
.row small{color:var(--tx2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .t{font-size:11px;color:var(--tx2);text-align:right}
.badge{display:inline-block;background:var(--acc);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;margin-top:4px}
.shop{display:flex;gap:12px;padding:14px;align-items:center;background:var(--bg2)}
.shop .av{width:52px;height:52px;border-radius:12px;background:#2e7d32;font-size:24px}
.shop b{font-size:16px}.shop small{display:block;color:var(--tx2);margin-top:2px}
.chips{display:flex;gap:8px;padding:10px 14px;overflow-x:auto}
.chip{border:1px solid var(--ln);border-radius:16px;padding:5px 13px;color:var(--tx2);white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 90px}
.card{border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:var(--bg)}
.pic{height:84px;display:grid;place-items:center;font-size:44px}
.pic.v{background:var(--veg)}.pic.f{background:var(--fruit)}
.card .b{padding:8px 10px 10px}
.card b{display:block;font-size:14px}
.card small{color:var(--tx2);display:block;font-size:12px}
.price{color:var(--tx);font-weight:600;margin:4px 0 6px}
.add{background:var(--acc);color:#fff;border-radius:16px;padding:5px 0;width:100%;font-weight:600;font-size:13px}
.step{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--acc);border-radius:16px;overflow:hidden}
.step button{width:34px;padding:4px 0;color:var(--acc);font-size:17px;font-weight:600}
.step span{font-weight:600}
.bun{display:flex;gap:12px;margin:0 14px 12px;border:1px solid var(--ln);border-radius:14px;padding:12px;align-items:center}
.bun .pic{width:68px;height:68px;border-radius:12px;font-size:28px;flex:none;background:var(--veg)}
.bun .m{flex:1;min-width:0}.bun b{font-size:15px}.bun small{display:block;color:var(--tx2);margin:2px 0 6px}
.save{color:var(--acc);font-size:12px;font-weight:600}
.bun .add{width:auto;padding:5px 14px;float:right}
.cartbar{position:absolute;left:12px;right:12px;bottom:62px;background:var(--acc);color:#fff;border-radius:24px;padding:11px 18px;display:flex;justify-content:space-between;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:5}
.sheet>div{background:var(--bg);width:100%;border-radius:20px 20px 0 0;padding:16px 16px 18px;max-height:75%;overflow-y:auto}
.sheet h2{margin:0 0 8px;font-size:17px}
.li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--ln)}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:16px;padding:12px 0}
.send{background:var(--acc);color:#fff;border-radius:24px;padding:12px;width:100%;font-weight:600;font-size:15px}
.close{color:var(--tx2);width:100%;padding:10px 0 0}
.toast{position:absolute;left:16px;right:16px;top:70px;background:#202c33;color:#fff;padding:11px 14px;border-radius:10px;z-index:9;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.chatbg{flex:1;overflow-y:auto;background:var(--chat);padding:10px 10px 6px;display:flex;flex-direction:column;gap:4px}
.day,.sys{align-self:center;background:var(--bg2);color:var(--tx2);font-size:12px;padding:4px 10px;border-radius:8px;margin:6px 0;text-align:center;max-width:85%}
.sys{background:rgba(245,166,35,.22);color:var(--tx)}
.bub{max-width:80%;padding:6px 9px 4px;border-radius:9px;box-shadow:0 1px 1px rgba(0,0,0,.12);line-height:1.35}
.bub.in{align-self:flex-start;background:var(--in);border-top-left-radius:2px}
.bub.out{align-self:flex-end;background:var(--out);border-top-right-radius:2px}
.bub .who{font-size:12px;font-weight:600;color:#2e7d32;display:block}
.bub .h{font-size:10.5px;color:var(--tx2);text-align:right;margin-top:1px}
.tick{color:#53bdeb}
.mini{display:flex;gap:9px;align-items:center;background:var(--bg2);border-radius:7px;padding:6px;margin-bottom:4px}
.mini .pic{width:44px;height:44px;border-radius:6px;font-size:24px;flex:none}
.mini small{display:block;color:var(--tx2)}
.ord{border-left:4px solid var(--acc);padding-left:8px;margin:2px 0 4px}
.ord b{display:block}
.comp{display:flex;gap:8px;padding:8px 10px;background:var(--bar);align-items:center}
.comp div{flex:1;background:var(--bg);border-radius:20px;padding:9px 14px;color:var(--tx2)}
.comp span{background:var(--acc);color:#fff;border-radius:50%;width:40px;height:40px;display:grid;place-items:center}
.hero{margin:14px;border-radius:16px;padding:16px;background:linear-gradient(135deg,#0b6b4f,#00a884);color:#fff}
.hero .n{font-size:34px;font-weight:700;line-height:1}
.hero p{margin:4px 0 12px}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.3);overflow:hidden}
.bar i{display:block;height:100%;background:#ffd54f;border-radius:6px}
.trail{padding:2px 16px 8px}
.ms{display:flex;gap:14px}
.ms .rail{display:flex;flex-direction:column;align-items:center}
.node{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--bg2);border:2px solid var(--ln);flex:none}
.done .node{background:var(--acc);border-color:var(--acc);color:#fff;font-size:18px}
.next .node{border-color:#f5a623;background:rgba(245,166,35,.2)}
.line{width:3px;flex:1;min-height:22px;background:var(--ln)}
.done .line{background:var(--acc)}
.ms .txt{padding-bottom:18px;flex:1}
.ms b{font-size:15px}.ms small{display:block;color:var(--tx2);margin-top:2px}
.lock{opacity:.6}
.mbar{height:8px;border-radius:5px;background:var(--bg2);margin-top:8px;overflow:hidden}
.mbar i{display:block;height:100%;background:#f5a623}
.lead{margin:0 14px 12px;border:1px solid var(--ln);border-radius:14px;padding:4px 12px}
.lead h3{margin:10px 0 2px;font-size:15px}
.lead div{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--ln)}
.lead div:first-of-type{border-top:0}
.note{color:var(--tx2);font-size:12px;text-align:center;padding:2px 16px 90px}
.co{padding:14px}.co h2{font-size:15px;margin:16px 0 8px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:8px;box-sizing:border-box}
.opt.on{border-color:var(--acc);background:var(--veg)}.opt .e{font-size:24px}.opt .m{flex:1}.opt b{display:block}.opt small{color:var(--tx2)}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--tx2);flex:none;box-sizing:border-box}
.on .radio{border-color:var(--acc);background:radial-gradient(var(--acc) 45%,transparent 50%)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px;padding:0 4px}.slots .chip{text-align:center}
.foot{padding:10px 14px;background:var(--bar);border-top:1px solid var(--ln)}
.pic.b{background:var(--veg)}.pic.a{background:rgba(106,27,154,.16)}
.nt{display:inline-block;background:rgba(245,166,35,.22);color:var(--tx);border-radius:6px;padding:2px 7px;font-size:11px;margin-top:3px}
.intro{margin:0;padding:0 14px 8px;color:var(--tx2)}
.by{font-weight:600;margin-top:3px}
.stats{margin:14px;border-radius:16px;padding:14px;background:linear-gradient(135deg,#0b6b4f,#00a884);color:#fff}
.sh{display:flex;justify-content:space-between;align-items:baseline}.sh small,.sm{opacity:.85;font-size:11px}.sm{display:block;margin-top:8px}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px;line-height:1.1}.stat small{font-size:11px;opacity:.9;min-height:28px}
.bars{display:flex;align-items:flex-end;gap:4px;height:40px;margin-top:6px}.bars i{flex:1;background:#ffd54f;border-radius:3px 3px 0 0}
.trow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--ln);box-sizing:border-box}
.trow .e{font-size:22px;width:30px;text-align:center}.trow .m{flex:1}.trow b{display:block;font-size:15px}.trow small{color:var(--tx2)}
.chev{color:var(--tx2);font-size:22px;transition:transform .2s}.chev.o{transform:rotate(90deg)}
.tbody{padding:6px 14px 14px 56px;border-bottom:1px solid var(--ln)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--ln)}.kv span{color:var(--tx2)}.kv b{text-align:right;font-weight:600}
.labs{display:flex;flex-wrap:wrap;gap:8px}.lb{display:flex;align-items:center;gap:6px;border:1px solid var(--ln);border-radius:16px;padding:5px 10px}.lb i{width:10px;height:10px;border-radius:50%}
.msgp{background:var(--out);border-radius:9px;padding:9px 11px;line-height:1.4;margin-bottom:6px}
.auto{display:block;font-size:11px;font-weight:600;color:var(--tx2);margin-bottom:3px}
.vd{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 0;border-bottom:1px solid var(--ln)}
.th{position:relative;width:76px;height:48px;border-radius:8px;background:linear-gradient(135deg,#0b6b4f,#00a884);display:grid;place-items:center;font-size:22px;flex:none}
.th i{position:absolute;right:4px;bottom:3px;font-style:normal;font-size:9px;background:rgba(0,0,0,.55);color:#fff;border-radius:3px;padding:1px 4px}
.vd .m{flex:1;min-width:0}.vd b{display:block;font-size:14px}.vd small{color:var(--tx2)}
.vp{position:relative;aspect-ratio:16/9;border-radius:12px;background:linear-gradient(135deg,#0b6b4f,#00a884);color:#fff;overflow:hidden}
.vp>span{position:absolute;left:12px;top:8px;font-size:30px}
.vp .play{position:absolute;inset:0;margin:auto;width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center;font-size:22px}
.pb{position:absolute;left:12px;right:12px;bottom:10px;height:4px;background:rgba(255,255,255,.35);border-radius:2px}.pb i{display:block;width:30%;height:100%;background:#ffd54f;border-radius:2px}
.edit{background:rgba(255,255,255,.2);color:#fff;border-radius:14px;padding:4px 12px;font-weight:600;font-size:13px}
.ei{width:100%;box-sizing:border-box;border:1px solid var(--ln);background:var(--bg2);color:var(--tx);border-radius:6px;padding:5px 6px;font:inherit;font-size:13px;margin-bottom:5px}
.er{display:flex;align-items:center;gap:4px}.er span{color:var(--tx2);font-size:12px}.er .ei{flex:1}
.del{color:#e5483d;font-weight:600;font-size:12px;padding:4px 0}
.addit{display:block;margin:0 14px 10px;width:calc(100% - 28px);border:1.5px dashed var(--acc);color:var(--acc);border-radius:12px;padding:9px;font-weight:600}
.lbt{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border:1px solid var(--ln);border-radius:10px;padding:1px 8px;margin-top:4px;color:var(--tx)}.lbt i{width:8px;height:8px;border-radius:50%}
.labbar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--bar);border-bottom:1px solid var(--ln);color:var(--tx2);font-size:12px}.labbar .lbt{margin-top:0}
.tbody.w{padding-left:14px}
.oc{border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:10px}.oc small{color:var(--tx2)}
.oh{display:flex;justify-content:space-between;gap:8px}.oi{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;font-size:12px}
.stg{display:flex;margin:12px 0 4px}
.sp{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;font-size:11px;color:var(--tx2)}
.sp i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600;background:var(--bg2);border:2px solid var(--ln);position:relative;z-index:1;box-sizing:border-box}
.sp:not(:first-child)::before{content:'';position:absolute;top:11px;right:50%;width:100%;height:3px;background:var(--ln)}
.sp.d i{background:var(--acc);border-color:var(--acc);color:#fff}.sp.c i{background:rgba(245,166,35,.25);border-color:#f5a623;color:var(--tx)}
.sp.d::before,.sp.c::before{background:var(--acc)}.sp.c{color:var(--tx);font-weight:600}
.adv{background:var(--acc);color:#fff;border-radius:14px;padding:4px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.ch h2{margin:0}.clr{color:#e5483d;font-weight:600;font-size:13px;padding:4px 0}
.mo{display:block;font-size:12px;font-weight:600;opacity:.9;margin-bottom:6px}
.pf{text-align:center;padding:22px 14px;background:var(--bg2)}.av.big{width:150px;height:102px;border-radius:16px;margin:0 auto 10px;background:#b7b5b4}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:contain;display:block}.pf h2{margin:0;font-size:20px}.pf small{color:var(--tx2)}
.pfb{padding:6px 14px 20px}.pfb h3{font-size:13px;color:var(--tx2);margin:14px 0 4px;font-weight:600}
.lk{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln);text-decoration:none;color:inherit}.lk .e{font-size:22px;width:30px;text-align:center}.lk .m{flex:1}.lk b{display:block}.lk small{color:var(--tx2)}
.qr{padding:7px 0;border-bottom:1px solid var(--ln)}.qr b{color:var(--acc);display:block}.qr span{color:var(--tx2)}
@media (max-width:430px){.stage{padding:0}.phone{border:0;border-radius:0;max-height:none}}
</style></head>

function cartSheet(){const it=Object.entries(S.cart);return `<div class="sheet"><div><div class="ch"><h2>Your cart</h2><button class="clr" data-a="clr">Clear cart</button></div>${it.map(([k,v])=>{const p=ALL.find(x=>x.id===k);return `<div class="li"><span>${v} × ${p.n}</span><span>${rm(v*p.p)}</span></div>`}).join('')}<div class="tot"><span>Total</span><span>${rm(tot())}</span></div><button class="send" data-a="checkout">Continue to checkout</button><button class="close" data-a="close">Keep shopping</button></div></div>`}
const colText=()=>S.col==='store'?'Pasar Pintu store, '+S.slot:'Community centre, from 4 pm';
function checkout(){const pays=[['cash','💵','Cash on collection','Pay when you pick up your order'],['tng','💙','Touch ’n Go eWallet','Pay now in the app'],['qr','📲','DuitNow QR','Scan with any banking app']];
const slots=['10–11 am','11 am–12 pm','12–1 pm','1–2 pm','2–3 pm','3–4 pm','4–5 pm'];
const lab={cash:'Place order · ',tng:'Pay with Touch ’n Go · ',qr:'Pay with DuitNow QR · '}[S.pay]+rm(tot());
return `<div class="top"><button class="back" data-a="cback" aria-label="Back">←</button><h1>Checkout</h1></div><div class="scroll co"><div class="li"><span>${cnt()} items in your order</span><b>${rm(tot())}</b></div>
<h2>Payment method</h2>${pays.map(p=>`<button class="opt ${S.pay===p[0]?'on':''}" data-a="pay" data-v="${p[0]}"><span class="e">${p[1]}</span><span class="m"><b>${p[2]}</b><small>${p[3]}</small></span><span class="radio"></span></button>`).join('')}
<h2>Collection</h2>
<button class="opt ${S.col==='store'?'on':''}" data-a="col" data-v="store"><span class="e">🏪</span><span class="m"><b>Scheduled collection</b><small>Pasar Pintu store · pick a time between 10 am and 5 pm</small></span><span class="radio"></span></button>
${S.col==='store'?`<div class="slots">${slots.map(s=>`<button class="chip ${S.slot===s?'on':''}" data-a="slot" data-v="${s}">${s}</button>`).join('')}</div>`:''}
<button class="opt ${S.col==='comm'?'on':''}" data-a="col" data-v="comm"><span class="e">🏘️</span><span class="m"><b>Shared community collection point</b><small>Community centre · pick up with your neighbours’ orders, ready from 4 pm</small></span><span class="radio"></span></button></div>
<div class="foot"><button class="send" data-a="send">${lab}</button></div>`}
function render(){const a=document.getElementById('app'),sc=a.querySelector('.scroll'),top=sc?sc.scrollTop:0;
let h;if(S.prof){h=profile()}else if(S.co){h=checkout()}else if(S.chat){h=thread(C.find(c=>c.id===S.chat))}else{
h={chats,shop,bund,comm,tools}[S.tab]()+(cnt()&&!S.ed&&(S.tab==='shop'||S.tab==='bund')?`<button class="cartbar" data-a="cart"><span>View cart · ${cnt()} items</span><span>${rm(tot())}</span></button>`:'')+`<nav class="tabs">${[['chats','💬','Chats'],['shop','🛍️','Catalogue'],['comm','🏆','Community'],['tools','🛠️','Tools']].map(([k,i,t])=>`<button class="${S.tab===k?'on':''}" data-a="tab" data-v="${k}"><span>${i}</span>${t}</button>`).join('')}</nav>`}
a.innerHTML=h+(S.cartOpen?cartSheet():'')+(S.vid!==null?player():'')+(S.toast?`<div class="toast">${S.toast}</div>`:'');
const n=a.querySelector('.scroll');if(n)n.scrollTop=top;const cb=document.getElementById('cb');if(cb)cb.scrollTop=cb.scrollHeight}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
if(a==='tab'){S.tab=v}else if(a==='chat'){S.chat=v;const c=C.find(x=>x.id===v);c.un=0}else if(a==='back'){S.chat=null}
else if(a==='filter'){S.f=v}else if(a==='add'){S.cart[v]=q(v)+1}else if(a==='sub'){S.cart[v]=q(v)-1;if(!S.cart[v])delete S.cart[v]}
else if(a==='cart'){S.cartOpen=true}else if(a==='close'){S.cartOpen=false}else if(a==='checkout'){S.co=true;S.cartOpen=false}else if(a==='cback'){S.co=false}else if(a==='pay'){S.pay=v}else if(a==='col'){S.col=v}else if(a==='slot'){S.slot=v}else if(a==='tool'){S.tl[v]=!S.tl[v]}else if(a==='vid'){S.vid=+v}else if(a==='vclose'){S.vid=null}else if(a==='edit'){S.ed=!S.ed}else if(a==='del'){delItem(v)}else if(a==='newitem'){newItem()}else if(a==='adv'){advOrder(v)}else if(a==='theme'){setTheme(v||(effTheme()==='dark'?'light':'dark'))}else if(a==='prof'){S.prof=true}else if(a==='pback'){S.prof=false}else if(a==='pcat'){S.prof=false;S.chat=null;S.tab='shop'}else if(a==='clr'){S.cart={};S.cartOpen=false;S.toast='Cart cleared';setTimeout(()=>{S.toast='';render()},2000)}
else if(a==='send'){const add=1;ORD.unshift({id:'PP'+(oid++),who:'Aina',it:Object.entries(S.cart).map(([k,v])=>v+' × '+ALL.find(x=>x.id===k).n).join(', '),tot:tot(),st:0,col:S.col,when:S.col==='store'?S.slot:'from 4 pm',pay:S.pay});S.orders+=add;const nx=M.find(m=>S.orders<m.at);S.cart={};S.cartOpen=false;S.co=false;S.tab='comm';
S.toast='Order placed ✓ '+colText()+' · Community now at '+S.orders+' orders'+(nx?' · '+(nx.at-S.orders)+' to '+nx.n:'');setTimeout(()=>{S.toast='';render()},3200)}
render()});
render();
</script></body></html>
